rtFile" accept="application/json" hidden onchange="importData(this)"></div><p class="muted">清除浏览器网站数据可能删除模拟器中的内容，请定期备份。</p>`)}function applyWallpaper(){let e=document.querySelector('.wall');e.style.background=state.wallpaper==='blue'?'linear-gradient(140deg,#204b87,#7fbcdf,#2d467b)':state.wallpaper==='pink'?'linear-gradient(145deg,#f8d3dd,#dfb7e5,#fce2cc)':''}applyWallpaper();function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='iphone-simulator-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(el){let f=el.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||typeof d!=='object'||Array.isArray(d))throw Error();if(!confirm('导入会覆盖当前模拟器数据，确定吗？'))return;state=d;save();location.reload()}catch{alert('文件格式不正确')}};r.readAsText(f)}function renderCalculator(){return appShell('calculator','计算器',`<div class="calcdisplay" id="calcDisplay">0</div><div class="calc">${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(x=>`<button class="${'÷×−+='.includes(x)?'op':''}" onclick="calcPress('${x}')">${x}</button>`).join('')}</div>`)}let calcText='0';function calcPress(x){if(x==='AC')calcText='0';else if(x==='⌫')calcText=calcText.slice(0,-1)||'0';else if(x==='±')calcText=String(-Number(calcText));else if(x==='%')calcText=String(Number(calcText)/100);else if(x==='='){try{let expr=calcText.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-');if(!/^[0-9+*/.()\-\s]+$/.test(expr))throw Error();let val=Function('return ('+expr+')')();calcText=Number.isFinite(val)?String(val):'错误'}catch{calcText='错误'}}else calcText=calcText==='0'||calcText==='错误'?x:calcText+x;document.getElementById('calcDisplay').textContent=calcText}function renderCalendar(){let d=new Date();return appShell('calendar','日历',`<div class="card" style="text-align:center"><h2>${d.getFullYear()} function mount(k,html){document.getElementById('screens').innerHTML=html;document.getElementById('home').style.display='none';document.getElementById('screen-'+k).classList.add('active')}
openApp=function(k){const render={camera:cameraApp,photos:photosApp,clock:clockApp,calendar:calendarApp,mail:mailApp,music:musicApp,files:filesApp,facetime:facetimeApp,weather:weatherApp,appstore:storeApp,phone:phoneApp,instagram:igApp,reminders:reminderApp};if(render[k]){mount(k,render[k]());if(k==='camera')startCamera();if(k==='clock')refreshClock();return}originalOpenApp(k)}
function addLocalFile(file,collection){if(!file)return;const reader=new FileReader();reader.onload=()=>{const data=reader.result;if(data.length>2800000){showToast('文件太大，请选择较小的文件');return}state[collection].push({id:Date.now(),name:file.name,type:file.type,data});try{save();openApp(collection==='photos'?'photos':collection==='music'?'music':'files')}catch(e){state[collection].pop();showToast('存储空间不足，请导出备份后清理文件')}};reader.readAsDataURL(file)}
function removeItem(key,id,app){if(!confirm('确定删除？'))return;state[key]=state[key].filter(x=>x.id!==id);save();openApp(app||key)}
function photosApp(){return appShell('photos','照片',`<div class="actionrow"><button class="btn" onclick="document.getElementById('photoFile').click()">＋ 导入照片</button><input hidden id="photoFile" type="file" accept="image/*" onchange="addLocalFile(this.files[0],'photos')"></div><div class="photo-grid">${state.photos.map((p,i)=>typeof p==='string'?`<div onclick="showToast('演示图片')">${esc(p)}</div>`:`<div onclick="viewPhoto(${p.id})"><img class="thumb" src="${p.data}"></div>`).join('')}</div><p class="muted">照片仅保存在当前浏览器中；请定期导出备份。</p>`)}
function viewPhoto(id){let p=state.photos.find(x=>x.id===id);if(!p)return;mount('photos',appShell('photos','照片',`<img class="mediaimg" src="${p.data}"><p>${esc(p.name)}</p><div class="actionrow"><button class="btn" onclick="openApp('photos')">返回图库</button><button class="btn" onclick="removeItem('photos',${id},'photos')">删除</button></div>`))}
let cameraStream=null;function cameraApp(){return appShell('camera','相机',`<video id="cameraPreview" autoplay muted playsinline style="width:100%;max-height:58vh;background:#111;border-radius:16px"></video><canvas id="cameraCanvas" hidden></canvas><div class="actionrow"><button class="btn" onclick="captureCamera()">◉ 拍照</button><button class="btn" onclick="switchCamera()">切换镜头</button></div><p class="muted">需在 HTTPS 网站上授权相机。无法授权时可从照片 App 导入图片。</p>`)}let cameraFacing='environment';async function startCamera(){try{if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cameraFacing},audio:false});let v=document.getElementById('cameraPreview');if(v)v.srcObject=cameraStream;else cameraStream.getTracks().forEach(t=>t.stop())}catch{showToast('无法打开相机，请检查 Safari 相机权限')}}async function switchCamera(){cameraFacing=cameraFacing==='environment'?'user':'environment';await startCamera()}function captureCamera(){let v=document.getElementById('cameraPreview');if(!v?.videoWidth){showToast('相机尚未准备好');return}let c=document.getElementById('cameraCanvas');c.width=Math.min(v.videoWidth,900);c.height=Math.round(c.width*v.videoHeight/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.7);state.photos.push({id:Date.now(),name:'拍摄照片.jpg',type:'image/jpeg',data});try{save();showToast('照片已保存')}catch{state.photos.pop();showToast('空间不足，无法保存')}}
const previousGoHome=goHome;goHome=function(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}previousGoHome()};
function clockApp(){return appShell('clock','时钟',`<div class="card"><h2>世界时钟</h2><h1 id="clockNow"></h1><p>东京 ${new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Tokyo'})}</p><p>伦敦 ${new Date().toLocaleTimeString('zh-CN',{timeZone:'Europe/London'})}</p></div><div class="card"><h2>倒计时</h2><div class="timerface" id="timerDisplay">00:00</div><input class="field" type="number" min="1" max="1440" id="timerMinutes" placeholder="分钟"><div class="actionrow"><button class="btn" onclick="startTimer()">开始</button><button class="btn" onclick="stopTimer()">停止</button></div></div><div class="card"><h2>闹钟提醒（页面打开时有效）</h2><input type="time" class="field" id="alarmTime"><button class="btn" onclick="addAlarm()">添加闹钟</button>${state.alarms.map((x,i)=>`<div class="listrow">${esc(x)} <button class="smallbtn" onclick="state.alarms.splice(${i},1);save();openApp('clock')">删除</button></div>`).join('')}</div>`)}let timerEnd=0,timerInterval;function refreshClock(){let e=document.getElementById('clockNow');if(e)e.textContent=new Date().toLocaleTimeString('zh-CN')}setInterval(refreshClock,1000);function startTimer(){let m=Number(document.getElementById('timerMinutes').value);if(!(m>0&&m<=1440))return showToast('请输入 1–1440 分钟');timerEnd=Date.now()+m*60000;clearInterval(timerInterval);timerInterval=setInterval(updateTimer,250);updateTimer()}function updateTimer(){let n=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));let e=document.getElementById('timerDisplay');if(e)e.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(n===0){clearInterval(timerInterval);showToast('倒计时结束')}}function stopTimer(){clearInterval(timerInterval);timerEnd=0;let e=document.getElementById('timerDisplay');if(e)e.textContent='00:00'}function addAlarm(){let t=document.getElementById('alarmTime').value;if(!t)return;state.alarms.push(t);save();openApp('clock')}let lastAlarmMinute='';setInterval(()=>{let d=new Date(),now=d.toTimeString().slice(0,5),key=d.toDateString()+now;if(key!==lastAlarmMinute&&state.alarms.includes(now)){lastAlarmMinute=key;alert('⏰ 闹钟 '+now)}},10000);
function calendarApp(){let d=simNow(),today=simDateInput(d);return appShell('calendar','日历',`<div class="card"><h2>${d.getFullYear()} 年 ${d.getMonth()+1} 月</h2><p>今天 ${d.toLocaleDateString('zh-CN')}</p></div><div class="card"><h3>新建日程</h3><input class="field" id="eventTitle" placeholder="日程名称"><input class="field" type="date" id="eventDate" value="${today}"><input class="field" type="time" id="eventTime" value="12:00"><button class="btn" onclick="addEvent()">保存日程</button></div><h3>我的日程</h3>${state.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="listrow card"><span>${esc(x.date)} ${esc(x.time)}<br><b>${esc(x.title)}</b></span><button class="smallbtn" onclick="removeItem('events',${x.id},'calendar')">删除</button></div>`).join('')||'<p class="muted">暂无日程</p>'}`)}function addEvent(){let title=document.getElementById('eventTitle').value.trim(),date=document.getElementById('eventDate').value,time=document.getElementById('eventTime').value;if(!title||!date)return showToast('请输入标题和日期');state.events.push({id:Date.now(),title,date,time});save();openApp('calendar')}
function reminderApp(){return appShell('reminders','提醒事项',`<h2>提醒事项</h2><input class="field" id="reminderInput" placeholder="添加提醒"><button class="btn" onclick="addReminder()">添加</button>${state.reminders.map((r,i)=>`<div class="listrow card"><label><input type="checkbox" onchange="state.reminders.splice(${i},1);save();openApp('reminders')"> ${esc(typeof r==='string'?r:r.text)}</label></div>`).join('')}`)}
function phoneApp(){return appShell('phone','电话',`<div class="actionrow"><button class="btn" onclick="phoneTab('dial')">拨号</button><button class="btn" onclick="phoneTab('contacts')">通讯录</button><button class="btn" onclick="phoneTab('recent')">最近通话</button></div><div id="phonePanel"></div>`).replace('</div></div>','</div></div>')}
const oldMount=mount;mount=function(k,html){oldMount(k,html);if(k==='phone')phoneTab('dial')};function phoneTab(tab){let el=document.getElementById('phonePanel');if(!el)return;if(tab==='dial')el.innerHTML=`<input class="field" id="dial" type="tel" placeholder="电话号码"><div class="keypad">${'123456789*0#'.split('').map(n=>`<button class="key" onclick="document.getElementById('dial').value+='${n}'">${n}</button>`).join('')}</div><div class="actionrow"><button class="btn" onclick="makeCall()">📞 拨号</button><button class="btn" onclick="document.getElementById('dial').value=document.getElementById('dial').value.slice(0,-1)">⌫</button></div>`;else if(tab==='contacts')el.innerHTML=`<input class="field" id="contactName" placeholder="姓名"><input class="field" id="contactNumber" type="tel" placeholder="电话号码"><button class="btn" onclick="addContact()">添加联系人</button>${state.contacts.map(x=>`<div class="listrow card"><span>${esc(x.name)}<br>${esc(x.number)}</span><button class="smallbtn" onclick="makeCall('${esc(x.number)}')">拨号</button></div>`).join('')}`;else el.innerHTML=state.callHistory.map(x=>`<div class="listrow card">${esc(x.number)} <span class="muted">${esc(x.time)}</span></div>`).join('')||'<p class="muted">暂无通话记录</p>'}function addContact(){let name=document.getElementById('contactName').value.trim(),number=document.getElementById('contactNumber').value.trim();if(!name||!number)return;state.contacts.push({name,number});save();phoneTab('contacts')}function makeCall(number){number=number||document.getElementById('dial')?.value||'';if(!/^[+0-9*#\s-]{2,30}$/.test(number))return showToast('请输入有效号码');state.callHistory.unshift({number,time:new Date().toLocaleString('zh-CN')});save();if(confirm('将使用 iPhone 电话功能拨打 '+number+'，是否继续？'))location.href='tel:'+number.replace(/[^+0-9*#]/g,'')}
function mailApp(){return appShell('mail','邮件',`<div class="card"><h2>撰写邮件</h2><input class="field" id="mailTo" type="email" placeholder="收件人邮箱"><input class="field" id="mailSubject" placeholder="主题"><textarea class="field" id="mailBody" rows="8" placeholder="邮件正文"></textarea><button class="btn" onclick="composeMail()">打开系统邮件发送</button></div><p class="muted">使用 iPhone 邮件应用发送，网页本身不读取邮箱。</p>`)}function composeMail(){let to=document.getElementById('mailTo').value.trim(),subject=document.getElementById('mailSubject').value,body=document.getElementById('mailBody').value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to))return showToast('请输入有效邮箱');location.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}
function musicApp(){return appShell('music','音乐',`<div class="card"><h2>我的音乐</h2><button class="btn" onclick="document.getElementById('musicFile').click()">＋ 导入音频</button><input hidden type="file" accept="audio/*" id="musicFile" onchange="addLocalFile(this.files[0],'music')"></div>${state.music.map(x=>`<div class="card"><b>${esc(x.name)}</b><audio controls preload="none" style="width:100%" src="${x.data}"></audio><button class="smallbtn" onclick="removeItem('music',${x.id},'music')">删除</button></div>`).join('')||'<p class="muted">请导入音频文件播放。</p>'}`)}
function filesApp(){return appShell('files','文件',`<div class="card"><button class="btn" onclick="document.getElementById('genericFile').click()">＋ 导入文件</button><input hidden type="file" id="genericFile" onchange="addLocalFile(this.files[0],'files')"></div>${state.files.map(x=>`<div class="listrow card"><span style="overflow-wrap:anywhere">📄 ${esc(x.name)}</span><div><a class="smallbtn" download="${esc(x.name)}" href="${x.data}">保存</a><button class="smallbtn" onclick="removeItem('files',${x.id},'files')">删除</button></div></div>`).join('')||'<p class="muted">尚未导入文件。</p>'}`)}
function facetimeApp(){return appShell('facetime','FaceTime',`<div class="card"><h2>视频通话</h2><p>网页版不能直接访问 Apple FaceTime 服务。可打开系统 FaceTime 链接。</p><input class="field" id="faceContact" placeholder="电话号码或 Apple 账号邮箱"><button class="btn" onclick="startFaceTime()">打开 FaceTime</button></div>`)}function startFaceTime(){let s=document.getElementById('faceContact').value.trim();if(!s)return;location.href='facetime:'+encodeURIComponent(s)}
function weatherApp(){return appShell('weather','天气',`<div class="card"><h2>查看天气</h2><input class="field" id="weatherCity" placeholder="城市，例如 Hiroshima"><button class="btn" onclick="weatherSearch()">查看实时天气</button><p class="muted">使用外部天气网页，需联网。</p></div>`)}function weatherSearch(){let q=document.getElementById('weatherCity').value.trim();if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q+' weather'),'_blank','noopener,noreferrer')}
function storeApp(){return appShell('appstore','App Store',`<div class="card"><h2>应用商店</h2><p>网页模拟器不能安装 iOS 原生 App。</p><button class="btn" onclick="window.open('https://apps.apple.com/','_blank','noopener,noreferrer')">打开 Apple App Store 网页</button></div>`)}
function igApp(){let posts=[...state.posts].reverse().map(p=>`<article class="post"><div class="posttop"><span class="avatar">◉</span><span>${esc(p.user)}</span></div><div class="postimg">${p.image?.startsWith('data:image/')?`<img class="mediaimg" src="${p.image}">`:esc(p.image)}</div><div class="postactions"><button onclick="likePost(${p.id})">${p.liked?'❤️':'♡'}</button><button onclick="commentPost(${p.id})">♧</button></div><div class="postcaption"><b>${p.likes} 次赞</b><p><b>${esc(p.user)}</b> ${esc(p.text)}</p>${p.comments.map(c=>`<div class="comment">${esc(c)}</div>`).join('')}</div></article>`).join('');return appShell('instagram','Instagram',`<div class="actionrow"><button class="btn" onclick="newPost()">＋ 发布动态</button><button class="btn" onclick="igProfile()">我的主页</button></div><div class="actionrow"><button class="btn" onclick="addStory()">＋ 发布 Story</button></div><div class="photo-grid">${state.igStories.map(s=>`<div onclick="alert(${JSON.stringify('Story: ')}+${JSON.stringify('')})">${esc(s.text)}</div>`).join('')}</div>${posts}<p class="muted">独立的本地 IG 模拟器，不连接真实 Instagram。</p>`)}
function addStory(){let t=prompt('输入 Story 内容');if(!t?.trim())return;state.igStories.unshift({id:Date.now(),text:t.trim()});save();openApp('instagram')}
function igProfile(){mount('instagram',appShell('instagram','我的 Instagram',`<div class="card"><h2>${esc(state.username)}</h2><p>${state.posts.filter(x=>x.user===state.username).length} 篇帖子</p><input class="field" id="igName" value="${esc(state.username)}"><button class="btn" onclick="state.username=document.getElementById('igName').value.trim()||state.username;save();igProfile()">保存用户名</button></div><button class="btn" onclick="openApp('instagram')">返回动态</button>`))}
// Override IG posting to support photo import, while preserving existing post structure.
newPost=function(){mount('instagram',appShell('instagram','新帖子',`<div class="card"><textarea id="igText" class="field" rows="4" placeholder="写点什么…"></textarea><input class="field" id="igImage" type="file" accept="image/*"><button class="btn" onclick="publishIG()">发布</button></div>`))};function publishIG(){let t=document.getElementById('igText').value.trim(),f=document.getElementById('igImage').files[0];if(!t&&!f)return showToast('请输入文字或选择照片');let publish=(image)=>{state.posts.push({id:Date.now(),user:state.username,text:t,image,likes:0,liked:false,comments:[]});try{save();openApp('instagram')}catch{state.posts.pop();showToast('存储空间不足')}};if(f){let r=new FileReader();r.onload=()=>{if(r.result.length>2200000)return showToast('图片太大，请压缩后再试');publish(r.result)};r.readAsDataURL(f)}else publish('🌷')}

 const log=state.yanSms.map(m=>`<div class="sms-bubble ${m.from==='me'?'sms-mine':'sms-other'}">${esc(m.text)}</div>`).join('');
 mount('messages',appShell('messages','闫桉',`<div class="sms-thread"><div class="sms-top"><img class="sms-avatar" src="${yanAvatar}" alt="闫桉头像"><div style="font-weight:600;margin-top:5px">闫桉</div><div class="sms-sub">19961025520 · 模拟互动</div></div><div class="sms-log" id="yanSmsLog">${log}</div><form class="sms-compose" onsubmit="smsSend(event)"><input id="yanSmsInput" placeholder="短信 / iMessage" autocomplete="off" maxlength="800"><button type="submit">发送 ↑</button></form></div>`));
 const el=document.getElementById('yanSmsLog');if(el)el.scrollTop=el.scrollHeight;
}
function smsReply(t){
 const x=t.toLowerCase();
 const picks=(arr)=>arr[Math.floor(Math.random()*arr.length)];
 if(/我叫|我的名字/.test(t))return '好，我记住了。以后就这样叫你哈哈。';
 if(/你是谁|你叫什么/.test(t))return '我是闫桉呀，怎么突然问这个哈哈';
 if(/早安|早上好|早/.test(t))return picks(['早呀，今天有什么安排？','早上好！吃早饭了吗？']);
 if(/晚安|睡觉/.test(t))return picks(['晚安，早点休息。','好，睡个好觉，明天聊。']);
 if(/雪|下雨|天气|冷|热/.test(t))return picks(['外面天气怎么样？记得穿暖和一点。','有拍照片吗？想看看你那边。']);
 if(/吃|饿|饭|奶茶/.test(t))return picks(['吃了什么好吃的？','别饿着，先去吃点东西哈哈。']);
 if(/累|难过|伤心|烦|压力/.test(t))return picks(['怎么了？愿意跟我说说吗？','那今天先休息一下，别太勉强自己。']);
 if(/想你|喜欢你|爱你/.test(t))return picks(['哈哈，突然这么说我会害羞的。','那今天多陪你聊一会儿。']);
 if(/[?？]|吗$|呢$/.test(t))return picks(['我想想……你怎么突然想到这个？','有可能呀，你觉得呢？','哈哈，先说说你怎么想的。']);
 return picks(['哈哈，然后呢？','我在听，你继续说。','真的假的，展开讲讲。','嗯嗯，今天还有什么新鲜事？','这听起来挺有意思的。']);
}
function smsSend(ev){
 if(ev)ev.preventDefault();const input=document.getElementById('yanSmsInput');if(!input)return;
 const t=input.value.trim();if(!t)return;
 state.yanSms.push({from:'me',text:t,time:Date.now()});
 try{save()}catch(e){showToast('本地存储空间不足')}
 smsConversation();
 setTimeout(()=>{state.yanSms.push({from:'other',text:smsReply(t),time:Date.now()});try{save()}catch(e){};
 if(document.getElementById('yanSmsLog'))smsConversation();else showToast('闫桉发来一条新消息');},650+Math.floor(Math.random()*800));
}
function smsPhone(){

}

let enteredPin='';
function refreshLockClock(){const d=simNow();document.getElementById('lockTime').textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('lockDate').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});}
function lockPhone(){document.getElementById('pinOverlay').classList.remove('visible');document.getElementById('lockOverlay').classList.remove('hidden');enteredPin='';refreshLockClock();}
function showPin(){enteredPin='';document.getElementById('pinError').textContent='';paintPin();document.getElementById('pinOverlay').classList.add('visible');}
function hidePin(){document.getElementById('pinOverlay').classList.remove('visible');enteredPin='';}
function paintPin(){document.getElementById('pinDots').innerHTML=Array.from({length:4},(_,i)=>`<span class="dot ${i<enteredPin.length?'filled':''}"></span>`).join('');}
function pinDigit(n){if(enteredPin.length>=4)return;enteredPin+=String(n);paintPin();if(enteredPin.length===4){if(enteredPin==='1025'){document.getElementById('pinOverlay').classList.remove('visible');document.getElementById('lockOverlay').classList.add('hidden');enteredPin='';}else{document.getElementById('pinError').textContent='密码错误，请重试';setTimeout(()=>{enteredPin='';paintPin()},450)}}}
document.getElementById('pinPad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n=>n===''?'<span></span>':`<button type="button" class="pinbtn" onclick="${n==='⌫'?"enteredPin=enteredPin.slice(0,-1);paintPin()":`pinDigit(${n})`}">${n}</button>`).join('');
let touchStartY=0;document.getElementById('lockOverlay').addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY},{passive:true});document.getElementById('lockOverlay').addEventListener('touchend',e=>{if(touchStartY-e.changedTouches[0].clientY>45)showPin()},{passive:true});
refreshLockClock();setInterval(refreshLockClock,15000);

 state.characterMemory??=[];

<script id="v28-standalone-ai-fix">
/* iOS Home Screen web apps can have separate storage from Safari.
   Keep all existing state and only supply the known Worker URL when absent. */
(function(){
 const DEFAULT_AI='https://iphone-sim-ai.lynnsun99.workers.dev';
 if(typeof state!=='object'||!state)return;
 if(typeof state.aiEndpoint!=='string'||!state.aiEndpoint.trim()){
   state.aiEndpoint=DEFAULT_AI;
   try{save()}catch(e){}
 }
 if(typeof state.aiEnabled!=='boolean')state.aiEnabled=true;
 if(!Array.isArray(state.yanSms))state.yanSms=[];
 if(!Array.isArray(state.yanDm))state.yanDm=[];
 if(!Array.isArray(state.characterMemory))state.characterMemory=[];
 if(!state.myPersona||typeof state.myPersona!=='object')state.myPersona={};
 // A standalone install can have independent storage; do not replace or import
 // chat records, wallpapers, or persona values from a different container.
 const previousSettings=renderSettings;
 renderSettings=function(){
   let html=previousSettings();
   const note='<p class="muted" style="font-size:12px;line-height:1.6">桌面版和 Safari 可能分别保存 AI 设置与聊天记录。此版本会在桌面版未设置地址时自动填入原 Worker；不会清空现有数据。若测试失败，请将下方完整报错截图发来。</p>';
   return html.replace('<div class="card"><h3 style="margin:0 0 9px">✦ AI 聊天连接</h3>', '<div class="card"><h3 style="margin:0 0 9px">✦ AI 聊天连接</h3>'+note);
 };
 const previousTest=aiTestConnection;
 aiTestConnection=async function(){
   const input=document.getElementById('aiEndpointInput');
   if(input&&!input.value.trim())input.value=DEFAULT_AI;
   return previousTest();
 };
})();
</script>
<script id="v29-fresh-browser-send-fix">
/* v29: independent first-run send flow. Do not depend on previously saved arrays.
   Keep messages visible even if storage or remote AI fails. */
(function(){
 const DEFAULT='https://iphone-sim-ai.lynnsun99.workers.dev';
 function safeSave(){try{save();return true}catch(err){console.warn('Save failed',err);return false}}
 function ensure(){
  if(!Array.isArray(state.yanSms))state.yanSms=[];
  if(!Array.isArray(state.yanDm))state.yanDm=[];
  if(!Array.isArray(state.yanMemory))state.yanMemory=[];
  if(!Array.isArray(state.characterMemory))state.characterMemory=[];
  if(!state.myPersona||typeof state.myPersona!=='object')state.myPersona={};
  if(!state.slowBurn||typeof state.slowBurn!=='object')state.slowBurn={affinity:0,stage:'普通朋友',lastIncoming:0};
  if(typeof state.aiEndpoint!=='string'||!state.aiEndpoint.trim())state.aiEndpoint=DEFAULT;
  if(typeof state.aiEnabled!=='boolean')state.aiEnabled=true;
 }
 ensure();
 function render(channel){try{if(channel==='sms')smsConversation();else yanDmView()}catch(e){console.error('Render chat failed',e);}}
 function addReply(channel,message){
  ensure();const key=channel==='sms'?'yanSms':'yanDm';
  state[key].push({from:'other',text:String(message),time:Date.now()});
  safeSave();render(channel);
 }
 const pending={sms:false,dm:false};
 async function send(channel,ev){
  if(ev&&typeof ev.preventDefault==='function')ev.preventDefault();
  const id=channel==='sms'?'yanSmsInput':'yanDmInput';
  const input=document.getElementById(id);
  const content=input&&String(input.value||'').trim();
  if(!content||pending[channel])return false;
  ensure();
  const key=channel==='sms'?'yanSms':'yanDm';
  state[key].push({from:'me',text:content,time:Date.now()});
  state.yanLastProactive=Date.now();
  // Optional memory updates must never prevent sending a message.
  try{if(typeof v14RememberIdentity==='function')v14RememberIdentity(content)}catch(e){console.warn(e)}
  try{if(typeof characterRememberFromText==='function')characterRememberFromText(content)}catch(e){console.warn(e)}
  try{if(typeof slowLearn==='function')slowLearn(content)}catch(e){console.warn(e)}
  try{if(typeof yanRemember==='function')yanRemember(content,channel)}catch(e){console.warn(e)}
  safeSave();
  input.value='';
  render(channel);
  if(!state.aiEnabled){addReply(channel,'AI 回复目前已关闭，可以在设置里开启。');return false}
  pending[channel]=true;
  try{
   const reply=await aiRequest(channel,false);
   addReply(channel,reply);
  }catch(e){
   console.error('AI request failed',e);
   addReply(channel,'⚠️ AI 暂时连接失败：'+String(e&&e.message||e).slice(0,200)+'。消息已保留，请稍后重试。');
  }finally{pending[channel]=false}
  return false;
 }
 aiSend=send;
 smsSend=function(ev){return send('sms',ev)};
 yanDmSend=function(ev){return send('dm',ev)};
 // Test must also work on a fresh browser before any chat exists.
 const oldTest=aiTestConnection;
 aiTestConnection=async function(){ensure();safeSave();return oldTest()};
})();
</script>
<script id="v30-incoming-unread-lockscreen-repair">
/* v30: fresh-browser safe simulated incoming messages and in-simulator alerts. */
(function(){
 function ensureIncoming(){
  if(!Array.isArray(state.yanSms))state.yanSms=[];
  if(!Array.isArray(state.yanDm))state.yanDm=[];
  if(!state.v17Unread||typeof state.v17Unread!=='object')state.v17Unread={sms:0,dm:0};
  for(const ch of ['sms','dm'])state.v17Unread[ch]=Math.max(0,Number(state.v17Unread[ch])||0);
 }
 function persist(){try{save()}catch(e){console.warn('Incoming state could not be saved',e)}}
 function chatVisible(ch){
  const el=document.getElementById(ch==='dm'?'yanDmLog':'yanSmsLog');
  const screen=document.getElementById('screen-'+(ch==='dm'?'weibo':'messages'));
  return !!(el&&screen&&screen.classList.contains('active'));
 }
 function refreshBadges(){
  ensureIncoming();
  try{v17DrawIcons()}catch(e){console.warn('Badge refresh',e)}
  try{v17RenderLock()}catch(e){console.warn('Lock notice refresh',e)}
 }
 yanReceive=function(ch,text,notify=true){
  ensureIncoming();ch=ch==='dm'?'dm':'sms';
  const key=ch==='dm'?'yanDm':'yanSms';
  const msg={from:'other',text:String(text||'收到一条新消息'),time:Date.now()};
  state[key].push(msg);if(state[key].length>300)state[key]=state[key].slice(-300);
  const opened=chatVisible(ch);
  if(!opened)state.v17Unread[ch]++;
  persist();
  if(opened){try{if(ch==='dm')yanDmView();else smsConversation()}catch(e){console.warn('Chat refresh',e)}}
  refreshBadges();
  if(notify&&!opened){try{showToast((ch==='dm'?'微博私信':'微信')+' · 闫桉发来新消息')}catch(e){}}
  return msg;
 };
 slowTestMessage=function(){
  ensureIncoming();state.yanLastProactive=Date.now();
  let message='今天怎么样？突然想跟你聊聊天。';
  try{if(typeof slowProactiveText==='function')message=slowProactiveText()||message}catch(e){console.warn(e)}
  yanReceive('sms',message,true);
  persist();
 };
 const oldMark=v17MarkRead;
 v17MarkRead=function(ch){ensureIncoming();return oldMark(ch)};
 // Restore notification badges after loading the page, including on a fresh browser.
 refreshBadges();
 window.addEventListener('pageshow',refreshBadges);
})();
</script>
<script>
/* v31: opt-in, age-gated, affinity-aware romantic chat. Existing state retained. */
(function(){
 const oldProfile=v18Profile;
 function romanticMode(){return !!(state.romanceAdultEnabled===true && state.romanceAdultsConfirmed===true)}
 v18Profile=function(channel){
   const p=oldProfile(channel);
   const a=Math.max(0,Math.min(100,Number(state.slowBurn?.affinity)||0));
   p.affinity=a;
   p.adultFlirtingEnabled=romanticMode();
   p.adultsConfirmed=!!state.romanceAdultsConfirmed;
   p.romanceStyle=a<31?'普通朋友':a<51?'轻度暧昧':a<71?'自然调情':a<86?'亲密暧昧':'恋人式亲密';
   p.partnerPersonality=(p.partnerPersonality||'')+'\n【暧昧模式】'+(romanticMode()?'已由成年玩家主动开启；按照好感度循序渐进，仅允许非露骨的成人双关、亲吻拥抱等亲密暗示。':'未开启；维持自然、克制的普通聊天。')+'\n当前亲密度：'+a+'/100；31分后才可轻度暧昧，低于31不主动擦边；尊重拒绝和边界。';
   return p;
 };
 const oldSettings=renderSettings;
 renderSettings=function(){
   const h=oldSettings();
   const a=Math.max(0,Math.min(100,Number(state.slowBurn?.affinity)||0));
   const panel=`<div class="card"><h3>♡ 成人暧昧聊天</h3><p class="muted">仅用于虚构成年人角色扮演。默认关闭，亲密度达到31才开始轻度暧昧；不包含露骨描写。</p><p>当前亲密度：<b>${a}/100</b> · ${a<31?'尚未解锁':a<51?'轻度暧昧':a<71?'自然调情':a<86?'亲密暧昧':'恋人式亲密'}</p><label style="display:block;margin:12px 0"><input id="romanceAdults" type="checkbox" ${state.romanceAdultsConfirmed?'checked':''}> 确认双方角色均为成年人（18岁及以上）</label><label style="display:block;margin:12px 0"><input id="romanceEnabled" type="checkbox" ${state.romanceAdultEnabled?'checked':''}> 开启成人暧昧模式（18+）</label><button class="btn" onclick="saveRomanceSettings()">保存暧昧设置</button></div>`;
   return h.replace('<div class="card"><h2>我的 iPhone</h2>',panel+'<div class="card"><h2>我的 iPhone</h2>');
 };
 window.saveRomanceSettings=function(){
   const adults=!!document.getElementById('romanceAdults')?.checked;
   const enabled=!!document.getElementById('romanceEnabled')?.checked;
   if(enabled&&!adults){showToast('请先确认双方角色均为成年人');return;}
   state.romanceAdultsConfirmed=adults;
   state.romanceAdultEnabled=enabled&&adults;
   try{save()}catch(e){console.warn('保存设置失败',e);showToast('设置未能保存，请检查浏览器存储');return}
   showToast(state.romanceAdultEnabled?'成人暧昧模式已开启':'成人暧昧模式已关闭');
   try{renderSettings()}catch(e){console.warn(e)}
 };
})();
</script>
