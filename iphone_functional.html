<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#e9eaf4"><title>iPhone · 手机模拟器</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;color:#16171b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#252732;display:flex;justify-content:center;align-items:center}.phone{position:relative;width:min(100vw,430px);height:min(100dvh,932px);overflow:hidden;background:#b7c6d8;border-radius:40px;box-shadow:0 15px 70px #0007}.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 78% 18%,#ffd4c6 0,transparent 42%),radial-gradient(ellipse at 12% 76%,#9d99db 0,transparent 55%),linear-gradient(145deg,#acc8e7,#f6d6d4 60%,#b2b3e3)}.status{position:absolute;z-index:40;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:12px 31px 0;font-size:15px;font-weight:700;pointer-events:none}.island{position:absolute;left:50%;transform:translateX(-50%);top:13px;width:113px;height:31px;background:#111;border-radius:30px}.statusright{display:flex;align-items:center;gap:5px}.battery{border:1.8px solid #171717;border-radius:4px;width:25px;height:12px;padding:2px}.battery:after{content:'';display:block;background:#171717;width:75%;height:100%;border-radius:1px}.home{position:absolute;inset:0;padding:83px 20px 117px;overflow:auto;scrollbar-width:none}.date{font-size:17px;color:#fff;text-shadow:0 1px 3px #0004}.bigtime{font-size:64px;font-weight:250;letter-spacing:-3px;color:#fff;line-height:1.15;text-shadow:0 1px 4px #0002}.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:23px 13px;margin-top:35px}.appicon{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;color:#fff;font-size:12px;font-weight:500;text-shadow:0 1px 3px #0005;padding:0;cursor:pointer;min-width:0}.tile{width:min(16vw,64px);height:min(16vw,64px);max-width:64px;max-height:64px;border-radius:15px;display:grid;place-items:center;box-shadow:0 3px 8px #0002;overflow:hidden;position:relative;font-size:34px;text-shadow:none}.tile svg{width:40px;height:40px}.dock{position:absolute;bottom:28px;left:17px;right:17px;height:91px;border-radius:29px;background:#ffffff5e;backdrop-filter:blur(25px);display:flex;align-items:center;justify-content:space-around}.dock .appicon span:last-child{display:none}.dock .tile{width:61px;height:61px}.indicator{position:absolute;z-index:50;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;background:#161616;border-radius:10px;cursor:pointer}.screen{position:absolute;z-index:10;inset:0;background:#f4f4f9;display:none;flex-direction:column;padding-top:56px}.screen.active{display:flex}.nav{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid #0000000a;flex-shrink:0}.back{border:0;background:none;color:#007aff;font-size:17px;cursor:pointer;padding:5px 0}.navtitle{font-size:18px;font-weight:700}.content{flex:1;overflow:auto;padding:18px 18px 80px;scrollbar-width:none}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 1px 3px #00000008}.field{width:100%;border:0;background:#fff;padding:13px;border-radius:11px;font:inherit;outline:none;margin:5px 0}.btn{border:0;background:#007aff;color:#fff;padding:11px 16px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}.muted{color:#8e8e93;font-size:13px}.listrow{padding:15px 4px;border-bottom:1px solid #e9e9ef;display:flex;align-items:center;gap:12px;cursor:pointer}.emoji{font-size:27px}.bottom-input{display:flex;gap:7px;padding:10px 13px 27px;background:#fff;align-items:center}.bottom-input input{flex:1;min-width:0;background:#f2f2f7}.bubble{max-width:80%;padding:11px 14px;border-radius:18px;margin:8px 0;line-height:1.45;overflow-wrap:anywhere}.mine{margin-left:auto;background:#34c759;color:white}.theirs{background:#e5e5ea}.chatlog{display:flex;flex-direction:column}.notearea{min-height:60vh;resize:none;background:#fff}.ighead{font-family:Georgia,serif;font-style:italic;font-size:27px;font-weight:bold}.post{background:#f t:inherit}.screen[data-app=instagram]{background:#fafafa}.screen[data-app=phone]{background:#f9f9fb}@media(min-width:550px){.phone{border:7px solid #111;height:min(95dvh,920px)}}@media(max-height:700px){.apps{gap:13px 10px;margin-top:12px}.home{padding-top:70px}.bigtime{font-size:45px}}

const KEY='iphone_simulator_fresh_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.notes??='欢迎使用备忘录 ✨\n这里的内容会自动保存在本机。';state.messages??=[{from:'other',text:'嗨！欢迎来到你的新手机 📱'}];state.posts??=[{id:1,user:'instagram',text:'欢迎来到你的 Instagram ✨',image:'🌸',likes:12,liked:false,comments:['欢迎来到这里！']}];state.photos??=['🌷','🌅','🐱','🌸','🌊','☁️'];state.contacts??=[{name:'朋友',number:'10086'}];state.wallpaper??='default';state.username??='我的主页';function save(){localStorage.setItem(KEY,JSON.stringify(state))}const icons={messages:['信息','#31d158','<path fill="white" d="M32 9C18 9 8 18 8 30c0 7 4 12 10 16l-2 10 11-6c19 3 29-7 29-20S45 9 32 9Z"/>'],phone:['电话','#31c65b','<path fill="white" d="M19 9c-4 0-8 6-8 12 1 14 20 33 34 33 6 0 12-4 12-8l-2-6-13-6-7 7c-7-3-12-8-15-15l7-7-6-13Z"/>'],photos:['照片','#fff','<g transform="translate(32 32)"><ellipse ry="20" rx="8" fill="#ffcb00" transform="rotate(0) translate(0 -12)"/><ellipse ry="20" rx="8" fill="#ff7139" transform="rotate(45) translate(0 -12)"/><ellipse ry="20" rx="8" fill="#ef397f" transform="rotate(90) translate(0 -12)"/><ellipse ry="20" rx="8" fill="#b24ad7" transform="rotate(135) translate(0 -12)"/><ellipse ry="20" rx="8" fill="#5289f5" transform="rotate(180) translate(0 -12)"/><ellipse ry="20" rx="8" fill="#45c9ec" transform="rotate(225) translate(0 -12)"/><ellipse ry="20" rx="8" fill="#42cb7e" transform="rotate(270) translate(0 -12)"/><ellipse ry="20" rx="8" fill="#a2d93d" transform="rotate(315) translate(0 -12)"/><circle r="8" fill="white"/></g>'],camera:['相机','#dddde2','<rect x="9" y="19" width="46" height="32" rx="7" fill="#42444b"/><circle cx="32" cy="35" r="12" fill="#858c9a" stroke="#cbd0d8" stroke-width="3"/><circle cx="32" cy="35" r="7" fill="#222"/><rect x="19" y="14" width="15" height="7" rx="2" fill="#42444b"/>'],notes:['备忘录','#fff','<path d="M8 13h48v44H8z" fill="#fff"/><path d="M8 9h48v12H8z" fill="#ffd23f"/><path d="M16 29h32M16 37h32M16 45h23" stroke="#b6b6b9" stroke-width="2"/>'],settings:['设置','#8e8e93','<text x="32" y="46" font-size="43" text-anchor="middle" fill="white">⚙</text>'],calendar:['日历','#fff','<text x="32" y="19" font-size="12" fill="red" text-anchor="middle">星期</text><text x="32" y="52" font-size="33" fill="#111" text-anchor="middle" id="calIcon">3</text>'],clock:['时钟','#222','<circle cx="32" cy="32" r="24" fill="white"/><circle cx="32" cy="32" r="21" fill="#191919"/><path d="M32 15v18l12 8" stroke="white" stroke-width="3" fill="none"/>'],weather:['天气','#54a9ff','<circle cx="24" cy="24" r="13" fill="#ffdc48"/><path d="M17 44c-4-13 14-19 21-8 13-4 18 13 7 17H21Z" fill="white"/>'],calculator:['计算器','#222','<text x="32" y="47" text-anchor="middle" fill="white" font-size="39">＋</text>'],maps:['地图','#fff','<path d="M0 20 64 0v64L0 45Z" fill="#d4e9cc"/><path d="m-4 45 72-29" stroke="#fff" stroke-width="11"/><path d="m28 -4 7 72" stroke="#ffe58a" stroke-width="12"/><path d="M32 12c-18 0-18 22 0 36 18-14 18-36 0-36Z" fill="#ec5353"/><circle cx="32" cy="23" r="6" fill="white"/>'],safari:['Safari','#fff','<circle cx="32" cy="32" r="27" fill="#168cff"/><circle cx="32" cy="32" r="23" fill="none" stroke="white" stroke-width="1"/><path d="m41 21-15 8-6 15 16-9Z" fill="white"/><path d="m41 21-9 14-6-6Z" fill="#ef474e"/>'],instagram:['Instagram','iggradient','<rect x="12" y="12" width="40" height="40" rx="12" fill="none" stroke="white" stroke-width="5"/><circle cx="32" cy="32" r="10" fill="none" stroke="white" stroke-width="5"/><circle cx="44" cy="20" r="3.5" fill="white"/>'],reminders:['提醒事项','#fff','<path d="M24 16h30M24 32h30M24 48h30" stroke="#aaa" stroke-width="3"/><circle cx="12" cy="16" r="4" fill="#4b9aff"/><circle cx="12" cy="32" r="4" fill="#ff9c33"/><circle cx="12" cy="48" r="4" fill="#ff5b78"/>'],music:['音乐','#fa4566','<path d="M29 12v32c-11-4-17 2-15 9 2 7 17 4 17-5V24l19-4v20c-11-4-17 2-15 9 2 7 17 4 17-5V9Z" fill="white"/>'],facetime:['FaceTime','#30c957','<rect x="8" y="18" width="33" height="29" rx="7" fill="white"/><path d="m42 27 14-9v30l-14-9" fill="white"/>'],files:['文件','#fff','<path d="M8 22h48v30H8z" fill="#4b98f7"/><path d="M8 16h23l5 6H8Z" fill="#74b4ff"/>'],appstore:['App Store','#1689f7','<path d="M22 47 42 15M20 15l24 37M13 41h38" stroke="white" stroke-width="6" stroke-linecap="round"/>']};const order=['facetime','calendar','photos','camera','mail','clock','maps','weather','reminders','notes','appstore','settings','instagram','calculator','files','music'];icons.mail=['邮件','#158bff','<rect x="8" y="17" width="48" height="32" rx="5" fill="white"/><path d="m10 19 22 17 22-17" fill="none" stroke="#158bff" stroke-width="3"/>'];function iconHTML(k){let [name,bg,svg]=icons[k];return `<button class="appicon" onclick="openApp('${k}')"><span class="tile" style="background:${bg==='iggradient'?'linear-gradient(35deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)':bg}"><svg viewBox="0 0 64 64">${svg}</svg></span><span>${name}</span></button>`}document.getElementById('apps').innerHTML=order.map(iconHTML).join('');document.getElementById('dock').innerHTML=['phone','safari','messages','instagram'].map(iconHTML).join('');function tick(){let d=new Date();let t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('statusTime').textContent=t;document.getElementById('homeTime').textContent=t;document.getElementById('dateLabel').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});document.getElementById('calIcon').textContent=d.getDate()}tick();setInterval(tick,30000);function goHome(){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('home').style.display='block'}function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2400)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function appShell(k,title,body,footer=''){return `<div class="screen" data-app="${k}" id="screen-${k}"><div class="nav"><button class="back" onclick="goHome()">‹ 返回</button><span class="navtitle">${title}</span><span style="width:45px"></span></div><div class="content">${body}</div>${footer}</div>`}function openApp(k){let html='';if(k==='instagram')html=renderIG();else if(k==='messages')html=renderMessages();else if(k==='notes')html=appShell(k,'备忘录',`<textarea class="field notearea" id="noteText" oninput="state.notes=this.value;save()">${esc(state.notes)}</textarea>`);else if(k==='phone')html=renderPhone();else if(k==='photos')html=appShell(k,'照片',`<h2>图库</h2><div class="photo-grid">${state.photos.map(p=>`<div>${esc(p)}</div>`).join('')}</div><p class="muted">这是模拟图库，不会读取真实手机照片。</p><button class="btn" onclick="addPhoto()">添加表情照片</button>`);else if(k==='settings')html=renderSettings();else if(k==='calculator')html=renderCalculator();else if(k==='calendar')html=renderCalendar();else if(k==='weather')html=appShell(k,'天气',`<div class="weather"><h2>我的城市</h2><strong>☀️</strong><p>天气演示</p><p>实时天气需要连接天气服务</p></div>`);else if(k==='clock')html=appShell(k,'时钟',`<div class="card"><h2>世界时钟</h2><h1 id="clockNow">${new Date().toLocaleTimeString('zh-CN')}</h1></div><div class="card">闹钟和计时器暂为展示功能</div>`);else if(k==='camera')html=appShell(k,'相机',`<div class="card" style="text-align:center;padding:55px 10px;background:#202124;color:white"><div style="font-size:80px">📷</div><p>模拟相机</p><button class="btn" onclick="snap()">拍一张模拟照片</button></div>`);else if(k==='reminders')html=appShell(k,'提醒事项',`<h2>我的提醒</h2><div id="reminderList">${(state.reminders||[]).map((x,i)=>`<div class="listrow"><input type="checkbox" onchange="state.reminders.splice(${i},1);save();openApp('reminders')"> ${esc(x)}</div>`).join('')}</div><input class="field" id="reminderInput" placeholder="添加提醒"><button class="btn" onclick="addReminder()">添加</button>`);else if(k==='safari')html=appShell(k,'Safari',`<div class="card"><h2>Safari</h2><p class="muted">输入网址后在新标签页打开</p><input class="field" id="webUrl" placeholder="https://example.com"><button class="btn" onclick="browse()">打开网页</button></div>`);else if(k==='maps')html=appShell(k,'地图',`<div class="card"><h2>地图</h2><p>打开在线地图搜索地点</p><input class="field" id="mapQuery" placeholder="搜索地点"><button class="btn" onclick="mapSearch()">搜索地图</button></div>`);else if(k==='mail')html=appShell(k,'邮件',`<div class="card"><h2>收件箱</h2><p class="muted">暂无邮件。此模拟器未连接真实邮箱。</p></div>`);else if(k==='facetime')html=appShell(k,'FaceTime',`<div class="card"><h2>FaceTime</h2><p>视频通话界面演示，未连接真实通话服务。</p><button class="btn" onclick="showToast('模拟通话，暂不支持真实拨号')">新建 FaceTime</button></div>`);else if(k==='files')html=appShell(k,'文件',`<div class="card"><h2>浏览</h2><p>我的 iPhone</p><p class="muted">这是独立网页，不能访问系统文件 App 的全部内容。</p></div>`);else if(k==='music')html=appShell(k,'音乐',`<div class="card"><h2>音乐</h2><p class="muted">尚未添加歌曲。</p></div>`);else if(k==='appstore')html=appShell(k,'App Store',`<div class="card"><h2>App Store</h2><p class="muted">模拟应用商店，不能在网页内安装 iOS 原生应用。</p></div>`);document.getElementById('screens').innerHTML=html;document.getElementById('home').style.display='none';document.getElementById('screen-'+k).classList.add('active');if(k==='messages'){let c=document.querySelector('.chatlog');c.scrollTop=c.scrollHeight}}
function renderIG(){let posts=[...state.posts].reverse().map(p=>`<article class="post"><div class="posttop"><span class="avatar">◉</span><span>${esc(p.user)}</span></div><div class="postimg">${esc(p.image)}</div><div class="postactions"><button onclick="likePost(${p.id})">${p.liked?'❤️':'♡'}</button><button onclick="commentPost(${p.id})">♧</button><span style="margin-left:auto">♧</span></div><div class="postcaption"><b>${p.likes} 次赞</b><p><b>${esc(p.user)}</b> ${esc(p.text)}</p>${p.comments.map(c=>`<div class="comment">${esc(c)}</div>`).join('')}<div class="comment" onclick="commentPost(${p.id})">添加评论…</div></div></article>`).join('');return appShell('instagram','Instagram',`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><span class="ighead">Instagram</span><button class="btn" onclick="newPost()">＋ 发布</button></div>${posts}<p class="muted" style="text-align:center">所有动态仅保存在当前浏览器中</p>`)}function newPost(){let text=prompt('写一条 Instagram 动态：');if(!text?.trim())return;let image=prompt('选一个表情作为图片（例如 🌸 ☕ 🐱）','🌷')||'🌷';state.posts.push({id:Date.now(),user:state.username,text:text.trim().slice(0,2000),image:image.slice(0,8),likes:0,liked:false,comments:[]});save();openApp('instagram')}function likePost(id){let p=state.posts.find(x=>x.id===id);p.liked=!p.liked;p.likes+=p.liked?1:-1;save();openApp('instagram')}function commentPost(id){let t=prompt('写评论：');if(!t?.trim())return;state.posts.find(x=>x.id===id).comments.push(`${state.username}：${t.trim()}`);save();openApp('instagram')}
function renderMessages(){return appShell('messages','信息',`<div class="chatlog" style="min-height:100%">${state.messages.map(m=>`<div class="bubble ${m.from==='me'?'mine':'theirs'}">${esc(m.text)}</div>`).join('')}</div>`,`<div class="bottom-input"><input class="field" id="msgInput" placeholder="短信" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn" onclick="sendMsg()">发送</button></div>`)}function sendMsg(){let e=document.getElementById('msgInput'),t=e.value.trim();if(!t)return;state.messages.push({from:'me',text:t});save();openApp('messages');showToast('已发送（本地模拟）')}function renderPhone(){return appShell('phone','电话',`<input class="field" style="font-size:32px;text-align:center;margin-top:25px" id="dial" placeholder="输入号码" readonly><div class="keypad">${'123456789*0#'.split('').map(n=>`<button class="key" onclick="document.getElementById('dial').value+='${n}'">${n}</button>`).join('')}</div><div style="text-align:center"><button class="btn" style="background:#34c759;border-radius:50%;font-size:25px;width:65px;height:65px" onclick="showToast('仅模拟拨号，不会发起真实通话')">☎</button></div><p class="muted" style="text-align:center">模拟拨号 · 不会实际呼叫</p>`)}function renderSettings(){return appShell('settings','设置',`<div class="card"><h2>我的 iPhone</h2><p class="muted">独立网页模拟器 · 数据只存储在当前浏览器</p></div><div class="card"><label>Instagram 用户名</label><input class="field" value="${esc(state.username)}" onchange="state.username=this.value;save()"><label>壁纸主题</label><select class="field" onchange="state.wallpaper=this.value;save();applyWallpaper()"><option value="default" ${state.wallpaper==='default'?'selected':''}>柔和彩色</option><option value="blue" ${state.wallpaper==='blue'?'selected':''}>深海蓝</option><option value="pink" ${state.wallpaper==='pink'?'selected':''}>樱花粉</option></select></div><div class="card"><button class="btn" onclick="exportData()">导出备份 JSON</button> <button class="btn" onclick="document.getElementById('importFile').click()">导入备份</button><input type="file" id="importFile" accept="application/json" hidden onchange="importData(this)"></div><p class="muted">清除浏览器网站数据可能删除模拟器中的内容，请定期备份。</p>`)}function applyWallpaper(){let e=document.querySelector('.wall');e.style.background=state.wallpaper==='blue'?'linear-gradient(140deg,#204b87,#7fbcdf,#2d467b)':state.wallpaper==='pink'?'linear-gradient(145deg,#f8d3dd,#dfb7e5,#fce2cc)':''}applyWallpaper();function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='iphone-simulator-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(el){let f=el.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||typeof d!=='object'||Array.isArray(d))throw Error();if(!confirm('导入会覆盖当前模拟器数据，确定吗？'))return;state=d;save();location.reload()}catch{alert('文件格式不正确')}};r.readAsText(f)}function renderCalculator(){return appShell('calculator','计算器',`<div class="calcdisplay" id="calcDisplay">0</div><div class="calc">${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(x=>`<button class="${'÷×−+='.includes(x)?'op':''}" onclick="calcPress('${x}')">${x}</button>`).join('')}</div>`)}let calcText='0';function calcPress(x){if(x==='AC')calcText='0';else if(x==='⌫')calcText=calcText.slice(0,-1)||'0';else if(x==='±')calcText=String(-Number(calcText));else if(x==='%')calcText=String(Number(calcText)/100);else if(x==='='){try{let expr=calcText.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-');if(!/^[0-9+*/.()\-\s]+$/.test(expr))throw Error();let val=Function('return ('+expr+')')();calcText=Number.isFinite(val)?String(val):'错误'}catch{calcText='错误'}}else calcText=calcText==='0'||calcText==='错误'?x:calcText+x;document.getElementById('calcDisplay').textContent=calcText}function renderCalendar(){let d=new Date();return appShell('calendar','日历',`<div class="card" style="text-align:center"><h2>${d.getFullYear()}年 ${d.getMonth()+1}月</h2><div style="font-size:75px;color:#f33">${d.getDate()}</div><p>${d.toLocaleDateString('zh-CN',{weekday:'long'})}</p></div><p class="muted">当前为日期展示版。</p>`)}function addReminder(){let v=document.getElementById('reminderInput').value.trim();if(!v)return;state.reminders??=[];state.reminders.push(v);save();openApp('reminders')}function addPhoto(){let p=prompt('输入一个表情作为模拟照片','🌼');if(p){state.photos.push(p.slice(0,8));save();openApp('photos')}}function snap(){state.photos.push('📸');save();showToast('模拟照片已保存到图库')}function browse(){let u=document.getElementById('webUrl').value.trim();if(!u)return;window.open(/^https?:\/\//.test(u)?u:'https://'+u,'_blank','noopener,noreferrer')}function mapSearch(){let q=document.getElementById('mapQuery').value.trim();if(q)window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank','noopener,noreferrer')}
</script><script>
// Functional local-first upgrades. No access to iOS private APIs.
state.events??=[];state.alarms??=[];state.contacts??=[];state.files??=[];state.photos??=[];state.music??=[];state.igStories??=[];state.drafts??=[];state.callHistory??=[];
const originalOpenApp=openApp;
const extraCSS=document.createElement('style');extraCSS.textContent=`.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actionrow button{flex:1}.listrow{display:flex;align-items:center;justify-content:space-between;gap:8px}.mediaimg{width:100%;max-height:340px;object-fit:cover;border-radius:12px}.thumb{width:100%;height:95px;object-fit:cover;border-radius:10px}.photo-grid>div{overflow:hidden}.field{margin:5px 0}.timerface{text-align:center;font-size:50px;font-weight:300;padding:20px}.smallbtn{border:0;background:#eee;border-radius:10px;padding:8px;color:#333}.content{padding-bottom:36px}`;document.head.appendChild(extraCSS);
function mount(k,html){document.getElementById('screens').innerHTML=html;document.getElementById('home').style.display='none';document.getElementById('screen-'+k).classList.add('active')}
openApp=function(k){const render={camera:cameraApp,photos:photosApp,clock:clockApp,calendar:calendarApp,contacts:contactsApp,mail:mailApp,music:musicApp,files:filesApp,facetime:facetimeApp,weather:weatherApp,appstore:storeApp,phone:phoneApp,instagram:igApp,reminders:reminderApp};if(render[k]){mount(k,render[k]());if(k==='camera')startCamera();if(k==='clock')refreshClock();return}originalOpenApp(k)}
function addLocalFile(file,collection){if(!file)return;const reader=new FileReader();reader.onload=()=>{const data=reader.result;if(data.length>2800000){showToast('文件太大，请选择较小的文件');return}state[collection].push({id:Date.now(),name:file.name,type:file.type,data});try{save();openApp(collection==='photos'?'photos':collection==='music'?'music':'files')}catch(e){state[collection].pop();showToast('存储空间不足，请导出备份后清理文件')}};reader.readAsDataURL(file)}
function removeItem(key,id,app){if(!confirm('确定删除？'))return;state[key]=state[key].filter(x=>x.id!==id);save();openApp(app||key)}
function photosApp(){return appShell('photos','照片',`<div class="actionrow"><button class="btn" onclick="document.getElementById('photoFile').click()">＋ 导入照片</button><input hidden id="photoFile" type="file" accept="image/*" onchange="addLocalFile(this.files[0],'photos')"></div><div class="photo-grid">${state.photos.map((p,i)=>typeof p==='string'?`<div onclick="showToast('演示图片')">${esc(p)}</div>`:`<div onclick="viewPhoto(${p.id})"><img class="thumb" src="${p.data}"></div>`).join('')}</div><p class="muted">照片仅保存在当前浏览器中；请定期导出备份。</p>`)}
function viewPhoto(id){let p=state.photos.find(x=>x.id===id);if(!p)return;mount('photos',appShell('photos','照片',`<img class="mediaimg" src="${p.data}"><p>${esc(p.name)}</p><div class="actionrow"><button class="btn" onclick="openApp('photos')">返回图库</button><button class="btn" onclick="removeItem('photos',${id},'photos')">删除</button></div>`))}
let cameraStream=null;function cameraApp(){return appShell('camera','相机',`<video id="cameraPreview" autoplay muted playsinline style="width:100%;max-height:58vh;background:#111;border-radius:16px"></video><canvas id="cameraCanvas" hidden></canvas><div class="actionrow"><button class="btn" onclick="captureCamera()">◉ 拍照</button><button class="btn" onclick="switchCamera()">切换镜头</button></div><p class="muted">需在 HTTPS 网站上授权相机。无法授权时可从照片 App 导入图片。</p>`)}let cameraFacing='environment';async function startCamera(){try{if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cameraFacing},audio:false});let v=document.getElementById('cameraPreview');if(v)v.srcObject=cameraStream;else cameraStream.getTracks().forEach(t=>t.stop())}catch{showToast('无法打开相机，请检查 Safari 相机权限')}}async function switchCamera(){cameraFacing=cameraFacing==='environment'?'user':'environment';await startCamera()}function captureCamera(){let v=document.getElementById('cameraPreview');if(!v?.videoWidth){showToast('相机尚未准备好');return}let c=document.getElementById('cameraCanvas');c.width=Math.min(v.videoWidth,900);c.height=Math.round(c.width*v.videoHeight/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.7);state.photos.push({id:Date.now(),name:'拍摄照片.jpg',type:'image/jpeg',data});try{save();showToast('照片已保存')}catch{state.photos.pop();showToast('空间不足，无法保存')}}
const previousGoHome=goHome;goHome=function(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}previousGoHome()};
function clockApp(){return appShell('clock','时钟',`<div class="card"><h2>世界时钟</h2><h1 id="clockNow"></h1><p>东京 ${new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Tokyo'})}</p><p>伦敦 ${new Date().toLocaleTimeString('zh-CN',{timeZone:'Europe/London'})}</p></div><div class="card"><h2>倒计时</h2><div class="timerface" id="timerDisplay">00:00</div><input class="field" type="number" min="1" max="1440" id="timerMinutes" placeholder="分钟"><div class="actionrow"><button class="btn" onclick="startTimer()">开始</button><button class="btn" onclick="stopTimer()">停止</button></div></div><div class="card"><h2>闹钟提醒（页面打开时有效）</h2><input type="time" class="field" id="alarmTime"><button class="btn" onclick="addAlarm()">添加闹钟</button>${state.alarms.map((x,i)=>`<div class="listrow">${esc(x)} <button class="smallbtn" onclick="state.alarms.splice(${i},1);save();openApp('clock')">删除</button></div>`).join('')}</div>`)}let timerEnd=0,timerInterval;function refreshClock(){let e=document.getElementById('clockNow');if(e)e.textContent=new Date().toLocaleTimeString('zh-CN')}setInterval(refreshClock,1000);function startTimer(){let m=Number(document.getElementById('timerMinutes').value);if(!(m>0&&m<=1440))return showToast('请输入 1–1440 分钟');timerEnd=Date.now()+m*60000;clearInterval(timerInterval);timerInterval=setInterval(updateTimer,250);updateTimer()}function updateTimer(){let n=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));let e=document.getElementById('timerDisplay');if(e)e.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(n===0){clearInterval(timerInterval);showToast('倒计时结束')}}function stopTimer(){clearInterval(timerInterval);timerEnd=0;let e=document.getElementById('timerDisplay');if(e)e.textContent='00:00'}function addAlarm(){let t=document.getElementById('alarmTime').value;if(!t)return;state.alarms.push(t);save();openApp('clock')}let lastAlarmMinute='';setInterval(()=>{let d=new Date(),now=d.toTimeString().slice(0,5),key=d.toDateString()+now;if(key!==lastAlarmMinute&&state.alarms.includes(now)){lastAlarmMinute=key;alert('⏰ 闹钟 '+now)}},10000);
function calendarApp(){let d=new Date(),today=d.toISOString().slice(0,10);return appShell('calendar','日历',`<div class="card"><h2>${d.getFullYear()} 年 ${d.getMonth()+1} 月</h2><p>今天 ${d.toLocaleDateString('zh-CN')}</p></div><div class="card"><h3>新建日程</h3><input class="field" id="eventTitle" placeholder="日程名称"><input class="field" type="date" id="eventDate" value="${today}"><input class="field" type="time" id="eventTime" value="12:00"><button class="btn" onclick="addEvent()">保存日程</button></div><h3>我的日程</h3>${state.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="listrow card"><span>${esc(x.date)} ${esc(x.time)}<br><b>${esc(x.title)}</b></span><button class="smallbtn" onclick="removeItem('events',${x.id},'calendar')">删除</button></div>`).join('')||'<p class="muted">暂无日程</p>'}`)}function addEvent(){let title=document.getElementById('eventTitle').value.trim(),date=document.getElementById('eventDate').value,time=document.getElementById('eventTime').value;if(!title||!date)return showToast('请输入标题和日期');state.events.push({id:Date.now(),title,date,time});save();openApp('calendar')}
function reminderApp(){return appShell('reminders','提醒事项',`<h2>提醒事项</h2><input class="field" id="reminderInput" placeholder="添加提醒"><button class="btn" onclick="addReminder()">添加</button>${state.reminders.map((r,i)=>`<div class="listrow card"><label><input type="checkbox" onchange="state.reminders.splice(${i},1);save();openApp('reminders')"> ${esc(typeof r==='string'?r:r.text)}</label></div>`).join('')}`)}
function phoneApp(){return appShell('phone','电话',`<div class="actionrow"><button class="btn" onclick="phoneTab('dial')">拨号</button><button class="btn" onclick="phoneTab('contacts')">通讯录</button><button class="btn" onclick="phoneTab('recent')">最近通话</button></div><div id="phonePanel"></div>`).replace('</div></div>','</div></div>')}
const oldMount=mount;mount=function(k,html){oldMount(k,html);if(k==='phone')phoneTab('dial')};function phoneTab(tab){let el=document.getElementById('phonePanel');if(!el)return;if(tab==='dial')el.innerHTML=`<input class="field" id="dial" type="tel" placeholder="电话号码"><div class="keypad">${'123456789*0#'.split('').map(n=>`<button class="key" onclick="document.getElementById('dial').value+='${n}'">${n}</button>`).join('')}</div><div class="actionrow"><button class="btn" onclick="makeCall()">📞 拨号</button><button class="btn" onclick="document.getElementById('dial').value=document.getElementById('dial').value.slice(0,-1)">⌫</button></div>`;else if(tab==='contacts')el.innerHTML=`<input class="field" id="contactName" placeholder="姓名"><input class="field" id="contactNumber" type="tel" placeholder="电话号码"><button class="btn" onclick="addContact()">添加联系人</button>${state.contacts.map(x=>`<div class="listrow card"><span>${esc(x.name)}<br>${esc(x.number)}</span><button class="smallbtn" onclick="makeCall('${esc(x.number)}')">拨号</button></div>`).join('')}`;else el.innerHTML=state.callHistory.map(x=>`<div class="listrow card">${esc(x.number)} <span class="muted">${esc(x.time)}</span></div>`).join('')||'<p class="muted">暂无通话记录</p>'}function addContact(){let name=document.getElementById('contactName').value.trim(),number=document.getElementById('contactNumber').value.trim();if(!name||!number)return;state.contacts.push({name,number});save();phoneTab('contacts')}function makeCall(number){number=number||document.getElementById('dial')?.value||'';if(!/^[+0-9*#\s-]{2,30}$/.test(number))return showToast('请输入有效号码');state.callHistory.unshift({number,time:new Date().toLocaleString('zh-CN')});save();if(confirm('将使用 iPhone 电话功能拨打 '+number+'，是否继续？'))location.href='tel:'+number.replace(/[^+0-9*#]/g,'')}
function mailApp(){return appShell('mail','邮件',`<div class="card"><h2>撰写邮件</h2><input class="field" id="mailTo" type="email" placeholder="收件人邮箱"><input class="field" id="mailSubject" placeholder="主题"><textarea class="field" id="mailBody" rows="8" placeholder="邮件正文"></textarea><button class="btn" onclick="composeMail()">打开系统邮件发送</button></div><p class="muted">使用 iPhone 邮件应用发送，网页本身不读取邮箱。</p>`)}function composeMail(){let to=document.getElementById('mailTo').value.trim(),subject=document.getElementById('mailSubject').value,body=document.getElementById('mailBody').value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to))return showToast('请输入有效邮箱');location.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}
function musicApp(){return appShell('music','音乐',`<div class="card"><h2>我的音乐</h2><button class="btn" onclick="document.getElementById('musicFile').click()">＋ 导入音频</button><input hidden type="file" accept="audio/*" id="musicFile" onchange="addLocalFile(this.files[0],'music')"></div>${state.music.map(x=>`<div class="card"><b>${esc(x.name)}</b><audio controls preload="none" style="width:100%" src="${x.data}"></audio><button class="smallbtn" onclick="removeItem('music',${x.id},'music')">删除</button></div>`).join('')||'<p class="muted">请导入音频文件播放。</p>'}`)}
function filesApp(){return appShell('files','文件',`<div class="card"><button class="btn" onclick="document.getElementById('genericFile').click()">＋ 导入文件</button><input hidden type="file" id="genericFile" onchange="addLocalFile(this.files[0],'files')"></div>${state.files.map(x=>`<div class="listrow card"><span style="overflow-wrap:anywhere">📄 ${esc(x.name)}</span><div><a class="smallbtn" download="${esc(x.name)}" href="${x.data}">保存</a><button class="smallbtn" onclick="removeItem('files',${x.id},'files')">删除</button></div></div>`).join('')||'<p class="muted">尚未导入文件。</p>'}`)}
function facetimeApp(){return appShell('facetime','FaceTime',`<div class="card"><h2>视频通话</h2><p>网页版不能直接访问 Apple FaceTime 服务。可打开系统 FaceTime 链接。</p><input class="field" id="faceContact" placeholder="电话号码或 Apple 账号邮箱"><button class="btn" onclick="startFaceTime()">打开 FaceTime</button></div>`)}function startFaceTime(){let s=document.getElementById('faceContact').value.trim();if(!s)return;location.href='facetime:'+encodeURIComponent(s)}
function weatherApp(){return appShell('weather','天气',`<div class="card"><h2>查看天气</h2><input class="field" id="weatherCity" placeholder="城市，例如 Hiroshima"><button class="btn" onclick="weatherSearch()">查看实时天气</button><p class="muted">使用外部天气网页，需联网。</p></div>`)}function weatherSearch(){let q=document.getElementById('weatherCity').value.trim();if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q+' weather'),'_blank','noopener,noreferrer')}
function storeApp(){return appShell('appstore','App Store',`<div class="card"><h2>应用商店</h2><p>网页模拟器不能安装 iOS 原生 App。</p><button class="btn" onclick="window.open('https://apps.apple.com/','_blank','noopener,noreferrer')">打开 Apple App Store 网页</button></div>`)}
function igApp(){let posts=[...state.posts].reverse().map(p=>`<article class="post"><div class="posttop"><span class="avatar">◉</span><span>${esc(p.user)}</span></div><div class="postimg">${p.image?.startsWith('data:image/')?`<img class="mediaimg" src="${p.image}">`:esc(p.image)}</div><div class="postactions"><button onclick="likePost(${p.id})">${p.liked?'❤️':'♡'}</button><button onclick="commentPost(${p.id})">♧</button></div><div class="postcaption"><b>${p.likes} 次赞</b><p><b>${esc(p.user)}</b> ${esc(p.text)}</p>${p.comments.map(c=>`<div class="comment">${esc(c)}</div>`).join('')}</div></article>`).join('');return appShell('instagram','Instagram',`<div class="actionrow"><button class="btn" onclick="newPost()">＋ 发布动态</button><button class="btn" onclick="igProfile()">我的主页</button></div><div class="actionrow"><button class="btn" onclick="addStory()">＋ 发布 Story</button></div><div class="photo-grid">${state.igStories.map(s=>`<div onclick="alert(${JSON.stringify('Story: ')}+${JSON.stringify('')})">${esc(s.text)}</div>`).join('')}</div>${posts}<p class="muted">独立的本地 IG 模拟器，不连接真实 Instagram。</p>`)}
function addStory(){let t=prompt('输入 Story 内容');if(!t?.trim())return;state.igStories.unshift({id:Date.now(),text:t.trim()});save();openApp('instagram')}
function igProfile(){mount('instagram',appShell('instagram','我的 Instagram',`<div class="card"><h2>${esc(state.username)}</h2><p>${state.posts.filter(x=>x.user===state.username).length} 篇帖子</p><input class="field" id="igName" value="${esc(state.username)}"><button class="btn" onclick="state.username=document.getElementById('igName').value.trim()||state.username;save();igProfile()">保存用户名</button></div><button class="btn" onclick="openApp('instagram')">返回动态</button>`))}
// Override IG posting to support photo import, while preserving existing post structure.
newPost=function(){mount('instagram',appShell('instagram','新帖子',`<div class="card"><textarea id="igText" class="field" rows="4" placeholder="写点什么…"></textarea><input class="field" id="igImage" type="file" accept="image/*"><button class="btn" onclick="publishIG()">发布</button></div>`))};function publishIG(){let t=document.getElementById('igText').value.trim(),f=document.getElementById('igImage').files[0];if(!t&&!f)return showToast('请输入文字或选择照片');let publish=(image)=>{state.posts.push({id:Date.now(),user:state.username,text:t,image,likes:0,liked:false,comments:[]});try{save();openApp('instagram')}catch{state.posts.pop();showToast('存储空间不足')}};if(f){let r=new FileReader();r.onload=()=>{if(r.result.length>2200000)return showToast('图片太大，请压缩后再试');publish(r.result)};r.readAsDataURL(f)}else publish('🌷')}

</script></body></html>
