<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f4"><title>心动来电 · AI 连通测试</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f4;color:#26332d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:560px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 20px 32px}h1{font-size:25px;margin:10px 0 8px}.sub{color:#69756e;line-height:1.6;font-size:14px}.card{background:white;border:1px solid #e5e9e5;border-radius:22px;padding:20px;margin-top:20px;box-shadow:0 5px 24px #213d2810}label{font-size:13px;font-weight:600;display:block;margin:16px 0 8px}input,textarea{width:100%;font:inherit;border:1px solid #dce3de;border-radius:13px;background:#fafcf9;padding:13px;color:#26332d;outline:none}textarea{min-height:100px;resize:vertical}button{width:100%;background:#607d6c;color:white;border:0;border-radius:14px;font-size:16px;font-weight:650;padding:15px;margin-top:16px}button:disabled{opacity:.55}.out{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;background:#f6f8f5;border-radius:14px;padding:14px;min-height:85px;font-size:14px}.tag{display:inline-block;background:#eaf0e9;color:#45604c;padding:6px 11px;border-radius:99px;font-size:12px}.tip{font-size:12px;color:#7b857e;line-height:1.7}</style></head><body><main class="wrap"><span class="tag">iPhone · 无需安装</span><h1>AI 聊天连接测试</h1><p class="sub">先测试 Cloudflare Worker 能否真正生成回复。此页面不会更改你的原 App。</p><section class="card"><label for="url">Worker 地址</label><input id="url" value="https://iphone-sim-ai.lynnsun99.workers.dev" autocapitalize="off" spellcheck="false"><label for="msg">测试消息</label><textarea id="msg">你好，你今天在做什么？</textarea><button id="send">发送测试消息</button><label>测试结果</label><div class="out" id="out" aria-live="polite">等待测试……</div><p class="tip">若出现 5028 或其他模型错误，请把这里的完整文字截图给我。若出现 Failed to fetch / CORS，表示浏览器跨域请求受阻，不一定是 AI 模型故障。</p></section></main><script>const $=id=>document.getElementById(id);$('send').addEventListener('click',async()=>{const btn=$('send');btn.disabled=true;$('out').textContent='正在连接 Worker，请稍候……';const url=$('url').value.trim().replace(/\/+$/,'');const body={messages:[{role:'user',content:$('msg').value.trim()}],profile:{myName:'Riria',partnerName:'小桉',relationship:'暧昧',myPersonality:'自然',partnerPersonality:'温柔'}};try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const raw=await res.text();let data;try{data=JSON.parse(raw)}catch{data=null}let message='HTTP 状态：'+res.status+' '+res.statusText+'\n\n';if(data){if(data.reply!==undefined)message+='AI 回复：\n'+(typeof data.reply==='string'?data.reply:JSON.stringify(data.reply,null,2));else message+='服务器返回：\n'+JSON.stringify(data,null,2)}else message+='服务器返回：\n'+raw;$('out').textContent=message}catch(e){$('out').textContent='请求未能完成：'+e.message+'\n\n可能是 Worker 未允许跨域访问（CORS）、网络问题或地址错误。请截图发给我。'}finally{btn.disabled=false}});</script></body></html>
